name: Nightly compatibility

# The latest release's examples archive, exactly as published, on the latest
# Roc nightly. The shared workflow selects one release and compiler pair and
# owns validation, execution and issue reporting.
on:
  schedule:
    - cron: "7 13 * * *"
  workflow_dispatch:
    inputs:
      nightly-tag:
        description: "Exact nightly tag for a diagnostic rerun; empty resolves latest"
        type: string
        default: ""
      release-tag:
        description: "Exact final release tag for a diagnostic rerun; empty resolves latest"
        type: string
        default: ""

permissions: {}

jobs:
  compatibility:
    permissions:
      contents: read
      issues: write
    uses: lukewilliamboswell/roc-automation/.github/workflows/nightly-compatibility.yml@0ad737abd3cad3d14d7e409e91161cd42c05142c # tools-0.10.1
    with:
      nightly-tag: ${{ inputs.nightly-tag || '' }}
      release-tag: ${{ inputs.release-tag || '' }}
      runners: '["ubuntu-24.04"]'
      setup-command: '["sudo", "apt-get", "install", "-y", "pandoc"]'
