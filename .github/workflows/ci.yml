name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: "Validate a nightly candidate"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned Roc version
        id: roc-version
        run: python3 scripts/workflow_helpers.py roc-version --github-output "$GITHUB_OUTPUT"
      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc-version.outputs.nightly-tag }}
      - run: roc version
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install --yes pandoc
      - run: pandoc --version
      - run: python3 scripts/all_tests.py
