name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@e12512e2605608588782edb044dd766137e34869
      - uses: roc-lang/setup-roc@30af91a173612e462a5df47f3b697c53c211f48c
        with:
          version: nightly
          download-method: asset-api
      - run: sudo apt-get update && sudo apt-get install --yes pandoc
      - run: blueprint run check
