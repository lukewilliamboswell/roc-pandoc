name: Release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: "Validate a nightly candidate without publishing"
        type: boolean
        required: false
        default: false
      release_version:
        description: "Release version, e.g. 1.0.0"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation) && format('release-{0}', github.repository) || format('release-validate-{0}-{1}', github.repository, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.nightly_validation }}

jobs:
  build:
    name: Build release bundle
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
      test_matrix: ${{ steps.bundles.outputs.test_matrix }}
    steps:
      - name: Require a version for publication
        if: github.event_name == 'workflow_dispatch' && !inputs.nightly_validation
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: test -n "$RELEASE_VERSION" || { echo "A release version is required for publication" >&2; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install stable tooling Roc and latest nightly
        id: roc
        uses: lukewilliamboswell/setup-roc@89a8a2945bd107f27b160096b3af7f52d2d78369
        with:
          version: stable-and-nightly
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install --yes pandoc
      - name: Validate release request
        id: validate
        uses: roc-lang/release-package/actions/validate-release@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          release_version: ${{ (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation) && inputs.release_version || '' }}
          dry_run: ${{ github.event_name != 'workflow_dispatch' || inputs.nightly_validation }}
          github_token: ${{ github.token }}
      - name: Validate release branch
        if: github.event_name == 'workflow_dispatch' && !inputs.nightly_validation
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF_TYPE" = branch && test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" || { echo "Releases must run from the default branch" >&2; exit 1; }
      - name: Validate package
        run: scripts/check_all.roc
        env:
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
      - name: Bundle package
        run: scripts/build_bundle.roc
        env:
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
          OUTPUT_DIR: dist
      - name: Prepare release bundle metadata
        id: bundles
        uses: roc-lang/release-package/actions/prepare-bundles@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          bundle_glob: dist/*.tar.zst
          test_os_json: '["ubuntu-latest"]'
      - name: Upload release bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundles
          path: .release/bundles/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: .release/release-bundles.json
          if-no-files-found: error
          retention-days: 7

  test-bundles:
    name: Test ${{ matrix.bundle_name }} bundle (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build.outputs.test_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable tooling Roc and latest nightly
        id: roc
        uses: lukewilliamboswell/setup-roc@89a8a2945bd107f27b160096b3af7f52d2d78369
        with:
          version: stable-and-nightly
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install --yes pandoc
      - name: Download release bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundles
          path: .release/test-bundles
      - name: Test release bundle
        env:
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
        uses: roc-lang/release-package/actions/test-bundle@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          test_bundle_command: scripts/test_bundle.roc --
          bundle_path: .release/test-bundles/${{ matrix.artifact_file }}
          bundle_name: ${{ matrix.bundle_name }}
          release_version: ${{ needs.build.outputs.release_version }}

  release-validation:
    name: release-validation
    if: always()
    needs: [build, test-bundles]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful release validation
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test-bundles.result }}
        run: test "$BUILD_RESULT" = success && test "$TEST_RESULT" = success

  publish-release:
    name: Publish GitHub release
    needs: [build, test-bundles, release-validation]
    if: github.event_name == 'workflow_dispatch' && !inputs.nightly_validation && needs.release-validation.result == 'success'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download release bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundles
          path: .release/bundles
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: .release
      - name: Install stable tooling Roc and latest nightly
        id: roc
        uses: lukewilliamboswell/setup-roc@89a8a2945bd107f27b160096b3af7f52d2d78369
        with:
          version: stable-and-nightly
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install --yes pandoc
      - name: Make release notes
        uses: roc-lang/release-package/actions/make-release-notes@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          release_version: ${{ needs.build.outputs.release_version }}
          github_token: ${{ github.token }}
      - name: Publish release
        uses: roc-lang/release-package/actions/publish-release@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          release_version: ${{ needs.build.outputs.release_version }}
          github_token: ${{ github.token }}
      - name: Pin examples to the published bundle
        run: scripts/update_example_pins.roc
        env:
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
          RELEASE_LIST_FILE: .release/release-bundles.json
          REPOSITORY: ${{ github.repository }}
          EXAMPLES_DIR: examples
      - name: Validate released examples
        run: scripts/check_all.roc
        env:
          ROC_STABLE: ${{ steps.roc.outputs.stable-executable }}
          ROC_NIGHTLY: ${{ steps.roc.outputs.nightly-executable }}
      - name: Open example pin follow-up PR
        uses: roc-lang/release-package/actions/create-followup-pr@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          release_version: ${{ needs.build.outputs.release_version }}
          paths: examples
          branch_prefix: release-followup
          base_branch: ${{ github.event.repository.default_branch }}
          commit_message: Pin examples to roc-pandoc ${{ needs.build.outputs.release_version }}
          pr_title: Pin examples to roc-pandoc ${{ needs.build.outputs.release_version }}
          pr_body: Updates every example app to consume the immutable bundle published in roc-pandoc ${{ needs.build.outputs.release_version }}.
          github_token: ${{ github.token }}
